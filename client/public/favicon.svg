<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple purple gradient background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#faviconGradient)" stroke="#7C3AED" stroke-width="2"/>
  
  <!-- Simplified document icon -->
  <rect x="35" y="25" width="30" height="40" rx="3" fill="white" fill-opacity="0.95"/>
  
  <!-- Document lines -->
  <line x1="40" y1="35" x2="60" y2="35" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="43" x2="55" y2="43" stroke="#A855F7" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="51" x2="58" y2="51" stroke="#C084FC" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Checkmark -->
